name: Vercel Production Deployment

on:
  push:
    branches:
      - main  # マージ先が main の場合はこのまま。master の場合は master に書き換えてください

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Build Check
        run: npm run build